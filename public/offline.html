<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#088178" />
    <title>CartWise - offline</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; font-family: system-ui, "Noto Sans Malayalam", sans-serif; background: #fef8f0; color: #212529; text-align: center; line-height: 1.6; }
      @media (prefers-color-scheme: dark) { body { background: #032724; color: #f5f5f5; } }
      img { width: 96px; height: 96px; border-radius: 24px; }
      h1 { font-size: 1.6rem; margin: 16px 0 4px; }
      p { margin: 4px 0; font-size: 1.1rem; opacity: 0.85; }
      a, button { margin-top: 20px; display: inline-block; min-height: 56px; padding: 0 28px; line-height: 56px; border: 0; border-radius: 999px; background: #088178; color: #fff; font-size: 1.1rem; font-weight: 700; text-decoration: none; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo-mark.png" alt="" />
      <h1>You are offline</h1>
      <p>This page was not saved on your phone yet.</p>
      <p>ഈ പേജ് ഫോണിൽ സേവ് ചെയ്തിട്ടില്ല. ഇന്റർനെറ്റ് വന്നാൽ വീണ്ടും തുറക്കൂ.</p>
      <a href="/app/sell">Open Sell</a>
      <br />
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
